name: coordenador
on:
  push:
    branches: [main]
    paths: ['coordenador/**', '.github/workflows/coordenador.yml']
  # No PR só compila (o APK fica como artefato); publicar no R2 é só a partir da main.
  pull_request:
    paths: ['coordenador/**', '.github/workflows/coordenador.yml']
  workflow_dispatch:
jobs:
  apk:
    name: Coordenador (APK assinado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Restaura keystore (mesma chave da câmera)
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/camera.jks"
          echo "CAMERA_KEYSTORE=$RUNNER_TEMP/camera.jks" >> "$GITHUB_ENV"
          echo "CAMERA_KEYSTORE_SENHA=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      # Build próprio (coordenador/settings.gradle.kts): não passa pelo settings da raiz.
      - name: Build (release assinado)
        run: gradle -p coordenador assembleRelease --no-daemon
      # A impressão vai para o log: tem de bater com a de coordenador/assetlinks.json, senão o painel abre com barra.
      - name: Confere a impressão da assinatura com o assetlinks.json
        run: |
          IMPRESSAO=$(keytool -list -v -keystore "$CAMERA_KEYSTORE" -storepass "$CAMERA_KEYSTORE_SENHA" -alias camera | grep -oP 'SHA256: \K[0-9A-F:]+')
          echo "SHA256 da assinatura: $IMPRESSAO"
          grep -q "$IMPRESSAO" coordenador/assetlinks.json || { echo "::error::a impressão da assinatura não está em coordenador/assetlinks.json"; exit 1; }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: coordenador-apk, path: coordenador/build/outputs/apk/release/coordenador-release.apk }
      # Só R2, como o tradutor: sem release no GitHub (o Obtainium da câmera acompanha as releases deste repo).
      - name: Publica no R2 e atualiza releases.json
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_PUBLICO: https://pub-520120b0b03b4d3f8c94c5c9ba10d569.r2.dev
        run: |
          VERSAO=$(grep -oP 'versionName = "\K[^"]+' coordenador/build.gradle.kts)
          CODIGO=$(grep -oP 'versionCode = \K[0-9]+' coordenador/build.gradle.kts)
          TAG="coordenador-v${VERSAO}-build${GITHUB_RUN_NUMBER}"
          APK=coordenador/build/outputs/apk/release/coordenador-release.apk
          aws s3 cp "$APK" "s3://omnigen-assets/coordenador/coordenador-${TAG}.apk" --endpoint-url "$R2_ENDPOINT" --content-type application/vnd.android.package-archive
          aws s3 cp "$APK" "s3://omnigen-assets/coordenador/coordenador.apk" --endpoint-url "$R2_ENDPOINT" --content-type application/vnd.android.package-archive --cache-control "no-cache"
          aws s3 cp "s3://omnigen-assets/coordenador/releases.json" releases-coordenador.json --endpoint-url "$R2_ENDPOINT" || echo '{"releases": []}' > releases-coordenador.json
          python3 - "$VERSAO" "$CODIGO" "$TAG" "$R2_PUBLICO" <<'PYEOF'
          import json, os, sys, subprocess, datetime
          versao, codigo, tag, pub = sys.argv[1:5]
          p = "releases-coordenador.json"
          try: m = json.load(open(p))
          except Exception: m = {"releases": []}
          msg = subprocess.run(["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True).stdout.strip()
          m.update({"versionName": versao, "versionCode": int(codigo), "build": int(os.environ["GITHUB_RUN_NUMBER"]),
                    "apk": f"{pub}/coordenador/coordenador.apk",
                    "apkVersao": f"{pub}/coordenador/coordenador-{tag}.apk",
                    "publicadoEm": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")})
          m["releases"] = [{"versao": versao, "build": int(os.environ["GITHUB_RUN_NUMBER"]), "tag": tag, "apk": m["apkVersao"], "mudou": [msg]}] + [r for r in m.get("releases", []) if r.get("tag") != tag]
          json.dump(m, open(p, "w"), ensure_ascii=False, indent=2); open(p, "a").write("\n")
          PYEOF
          aws s3 cp releases-coordenador.json "s3://omnigen-assets/coordenador/releases.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "no-cache"
