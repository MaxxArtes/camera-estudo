name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    name: APK de depuração (instalável direto no celular)
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      # Artifact é best-effort (cota de storage já estourou no passado); a entrega de verdade é o
      # release "ultimo", cujo asset não conta na cota e tem link fixo.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: camera-estudo-debug, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publica releases (uma por build, com histórico, e o link fixo "ultimo")
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VERSAO=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSAO}-build${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "camera-estudo-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk camera-estudo.apk
          # histórico: cada build vira uma release própria, fica guardada para baixar depois
          gh release create "$TAG" "camera-estudo-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (v${VERSAO})" --notes "Commit: ${GITHUB_SHA:0:7} — $(git log -1 --pretty=%s)"
          # link fixo: sempre a última
          gh release create ultimo --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Última build" --notes "Sempre o APK mais recente. Histórico completo nas releases numeradas." || true
          gh release upload ultimo camera-estudo.apk --repo "$GITHUB_REPOSITORY" --clobber
